<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practical 10 - Save Student Details</title>
</head>
<body>
  <h2>Practical 10: Save Student Details into PostgreSQL</h2>

  <h3>Save Student</h3>
  <form id="studentForm">
    <label>Name: </label>
    <input type="text" id="name" required><br><br>

    <label>Email: </label>
    <input type="email" id="email" required><br><br>

    <label>Course: </label>
    <input type="text" id="course" required><br><br>

    <button type="submit">Save Student</button>
  </form>

  <h3>Student Records</h3>
  <table border="1" cellpadding="5" cellspacing="0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
      </tr>
    </thead>
    <tbody id="studentBody"></tbody>
  </table>

  <script>
    async function loadStudents() {
      var res = await fetch('/api/students');
      var students = await res.json();
      var tbody = document.getElementById('studentBody');
      tbody.innerHTML = '';
      students.forEach(function(s) {
        tbody.innerHTML += '<tr><td>' + s.id + '</td><td>' + s.name + '</td><td>' + s.email + '</td><td>' + s.course + '</td></tr>';
      });
    }

    document.getElementById('studentForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var student = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        course: document.getElementById('course').value
      };
      await fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(student)
      });
      document.getElementById('studentForm').reset();
      loadStudents();
    });

    loadStudents();
  </script>
</body>
</html>
