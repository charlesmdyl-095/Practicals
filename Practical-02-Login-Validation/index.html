<!DOCTYPE html>
<html lang="en" ng-app="loginApp">
<head>
  <meta charset="UTF-8">
  <title>Practical 2 - Login Validation</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="LoginController">
  <h2>Practical 2: Login Form with Validation</h2>
  
  <form name="loginForm" ng-submit="login()" novalidate>
    <div>
      <label>Email: </label>
      <input type="email" name="email" ng-model="user.email" required>
      <span style="color:red;" ng-show="loginForm.email.$touched && loginForm.email.$invalid">
        <span ng-show="loginForm.email.$error.required">Email is required.</span>
        <span ng-show="loginForm.email.$error.email">Invalid email format.</span>
      </span>
    </div>
    <br>
    <div>
      <label>Password: </label>
      <input type="password" name="password" ng-model="user.password" required ng-minlength="6">
      <span style="color:red;" ng-show="loginForm.password.$touched && loginForm.password.$invalid">
        <span ng-show="loginForm.password.$error.required">Password is required.</span>
        <span ng-show="loginForm.password.$error.minlength">Minimum 6 characters.</span>
      </span>
    </div>
    <br>
    <button type="submit" ng-disabled="loginForm.$invalid">Login</button>
  </form>

  <p style="color:green;" ng-show="message">{{ message }}</p>

  <script src="app.js"></script>
</body>
</html>
